<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>La petite brochure</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap');

  :root{
    --ink:#14181d;
    --ink-soft:#1d232b;
    --paper:#f6f1e4;
    --paper-line:#e4dcc7;
    --graphite:#2b2e33;
    --stamp:#b23b2e;
    --stamp-dark:#8f2e24;
    --sage:#6b8f71;
    --muted:#8b93a1;
    --focus:#e8b04b;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    background-image:
      radial-gradient(circle at 20% 0%, rgba(232,176,75,0.06), transparent 45%),
      radial-gradient(circle at 100% 100%, rgba(107,143,113,0.07), transparent 50%);
    min-height:100vh;
    font-family:'Manrope',sans-serif;
    color:var(--paper);
    display:flex;
    justify-content:center;
    padding:0;
  }
  .phone{
    width:100%;
    max-width:460px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
  }

  header{
    padding:28px 24px 18px;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .mark{
    width:34px;height:34px;
    border:2px solid var(--focus);
    border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    position:relative;
    flex-shrink:0;
  }
  .mark::before, .mark::after{
    content:"";
    position:absolute;
    width:8px;height:8px;
    border:2px solid var(--focus);
  }
  .mark::before{top:-2px;left:-2px;border-right:none;border-bottom:none;}
  .mark::after{bottom:-2px;right:-2px;border-left:none;border-top:none;}
  .mark span{width:10px;height:10px;border-radius:50%;background:var(--focus);}
  header h1{
    font-family:'IBM Plex Mono',monospace;
    font-size:15px;
    letter-spacing:0.04em;
    margin:0;
    color:var(--paper);
    font-weight:600;
  }
  header p{
    margin:2px 0 0;
    font-size:11.5px;
    color:var(--muted);
    font-family:'IBM Plex Mono',monospace;
    letter-spacing:0.03em;
  }

  main{
    flex:1;
    display:flex;
    flex-direction:column;
    padding:0 20px 32px;
  }

  .step-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--focus);
    margin:6px 2px 14px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .step-label .n{
    background:rgba(232,176,75,0.14);
    border:1px solid rgba(232,176,75,0.4);
    border-radius:4px;
    padding:2px 7px;
    font-weight:600;
  }

  /* ---- Capture screen ---- */
  .scan-frame{
    background:var(--ink-soft);
    border-radius:20px;
    aspect-ratio:3/4;
    position:relative;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid rgba(255,255,255,0.06);
  }
  .scan-frame img{
    width:100%;height:100%;object-fit:cover;
    display:block;
  }
  .corner{position:absolute;width:34px;height:34px;border-color:var(--focus);border-style:solid;border-width:0;transition:all .4s ease;}
  .corner.tl{top:22px;left:22px;border-top-width:3px;border-left-width:3px;border-radius:8px 0 0 0;}
  .corner.tr{top:22px;right:22px;border-top-width:3px;border-right-width:3px;border-radius:0 8px 0 0;}
  .corner.bl{bottom:22px;left:22px;border-bottom-width:3px;border-left-width:3px;border-radius:0 0 0 8px;}
  .corner.br{bottom:22px;right:22px;border-bottom-width:3px;border-right-width:3px;border-radius:0 0 8px 0;}
  .scan-frame.active .corner{width:44px;height:44px;}
  .scan-frame .hint{
    font-family:'IBM Plex Mono',monospace;
    color:var(--muted);
    font-size:12.5px;
    text-align:center;
    padding:0 30px;
    letter-spacing:0.02em;
  }
  .scan-line{
    position:absolute;left:10%;right:10%;height:2px;
    background:linear-gradient(90deg, transparent, var(--focus), transparent);
    box-shadow:0 0 12px 2px rgba(232,176,75,0.6);
    top:0;
    opacity:0;
  }
  .scan-frame.scanning .scan-line{
    opacity:1;
    animation:sweep 1.6s ease-in-out infinite;
  }
  @keyframes sweep{
    0%{top:8%;}
    50%{top:88%;}
    100%{top:8%;}
  }

  input[type=file]{display:none;}

  .btn{
    font-family:'Manrope',sans-serif;
    font-weight:700;
    font-size:15px;
    border:none;
    border-radius:12px;
    padding:16px 18px;
    cursor:pointer;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition:transform .15s ease, filter .15s ease;
  }
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--focus); color:var(--ink);}
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-secondary{background:transparent;color:var(--paper);border:1px solid rgba(255,255,255,0.18);}
  .btn-stamp{background:var(--stamp);color:var(--paper);}
  .btn-stamp:hover{filter:brightness(1.08);}
  .btn[disabled]{opacity:0.45;cursor:not-allowed;}

  .row{display:flex;gap:10px;margin-top:14px;}
  .row .btn{margin-top:0;}

  .card-title{margin:24px 0 6px;font-size:20px;font-weight:800;color:var(--paper);}
  .card-sub{margin:0 0 20px;color:var(--muted);font-size:13.5px;line-height:1.5;}

  /* ---- Confirm screen ---- */
  .id-card{
    background:var(--paper);
    color:var(--graphite);
    border-radius:16px;
    padding:20px;
    position:relative;
    box-shadow:0 12px 30px rgba(0,0,0,0.35);
  }
  .id-card .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--stamp-dark);
    font-weight:700;
  }
  .id-card textarea{
    width:100%;
    border:none;
    background:transparent;
    font-family:'Manrope',sans-serif;
    font-weight:700;
    font-size:19px;
    color:var(--graphite);
    resize:none;
    margin-top:6px;
    line-height:1.35;
    padding:0;
  }
  .id-card textarea:focus{outline:none;}
  .id-thumb{
    width:56px;height:56px;border-radius:10px;object-fit:cover;
    border:1px solid var(--paper-line);
    position:absolute;top:18px;right:18px;
  }
  .id-card .divider{height:1px;background:var(--paper-line);margin:16px 0;}
  .id-card .note{font-size:12.5px;color:#6b6455;line-height:1.5;}

  /* ---- Language screen ---- */
  .lang-list{display:flex;flex-direction:column;gap:10px;}
  .lang-opt{
    background:var(--ink-soft);
    border:1px solid rgba(255,255,255,0.07);
    border-radius:12px;
    padding:14px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    cursor:pointer;
    font-weight:600;
    font-size:15px;
    transition:border-color .15s ease, background .15s ease;
  }
  .lang-opt .flag{font-size:20px;margin-right:10px;}
  .lang-opt.selected{border-color:var(--focus); background:rgba(232,176,75,0.08);}
  .lang-opt .check{width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,0.25);}
  .lang-opt.selected .check{border-color:var(--focus);background:var(--focus);}

  /* ---- Result screen ---- */
  .loader-wrap{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:60px 20px;gap:18px;
  }
  .spinner{
    width:40px;height:40px;border-radius:50%;
    border:3px solid rgba(232,176,75,0.2);
    border-top-color:var(--focus);
    animation:spin 0.9s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .loader-wrap p{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--muted);text-align:center;}

  .result-card{
    background:var(--paper);
    color:var(--graphite);
    border-radius:16px;
    padding:22px;
    position:relative;
    overflow:hidden;
  }
  .stamp-badge{
    position:absolute;
    top:16px;right:-30px;
    background:var(--sage);
    color:#fff;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    font-weight:700;
    letter-spacing:0.08em;
    padding:5px 34px;
    transform:rotate(6deg);
    box-shadow:0 3px 8px rgba(0,0,0,0.2);
  }
  .stamp-badge.miss{background:var(--stamp);}
  .result-card h3{margin:4px 0 4px;font-size:19px;}
  .result-card .src{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:#6b6455;
    margin-bottom:14px;
    word-break:break-all;
  }
  .result-card .body-text{font-size:14px;line-height:1.55;color:#3a352c;margin-bottom:18px;white-space:pre-wrap;}
  .link-btn{
    display:block;
    text-align:center;
    background:var(--ink);
    color:var(--paper);
    text-decoration:none;
    font-weight:700;
    font-size:14.5px;
    padding:14px;
    border-radius:10px;
  }

  .ghost-link{
    text-align:center;
    margin-top:16px;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--muted);
    background:none;border:none;
    text-decoration:underline;
    cursor:pointer;
  }

  .progress-dots{display:flex;gap:6px;justify-content:center;padding:16px 0 6px;}
  .progress-dots span{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.15);}
  .progress-dots span.done{background:var(--focus);}

  .error-box{
    background:rgba(178,59,46,0.12);
    border:1px solid rgba(178,59,46,0.4);
    color:#e6a89f;
    font-size:13px;
    padding:12px 14px;
    border-radius:10px;
    margin-bottom:14px;
    font-family:'IBM Plex Mono',monospace;
    line-height:1.5;
  }
</style>
</head>
<body>
<div class="phone">
  <header>
    <div class="mark"><span></span></div>
    <div>
      <h1>La petite brochure</h1>
      <p>Photo → vraie notice officielle</p>
    </div>
  </header>

  <main id="app"></main>
</div>

<script>
const state = {
  step: 'capture', // capture -> analyzing -> confirm -> language -> searching -> result
  imageDataUrl: null,
  imageBase64: null,
  imageMediaType: null,
  description: '',
  language: null,
  result: null,
  error: null
};

const LANGS = [
  {code:'Français', flag:'🇫🇷'},
  {code:'English', flag:'🇬🇧'},
  {code:'Español', flag:'🇪🇸'},
  {code:'Deutsch', flag:'🇩🇪'},
  {code:'Italiano', flag:'🇮🇹'},
  {code:'Nederlands', flag:'🇳🇱'}
];

const app = document.getElementById('app');

function stepIndex(){
  return {capture:0, analyzing:0, confirm:1, language:2, searching:2, result:3}[state.step];
}

function dots(){
  let html = '<div class="progress-dots">';
  for(let i=0;i<4;i++){
    html += `<span class="${i<=stepIndex() ? 'done':''}"></span>`;
  }
  html += '</div>';
  return html;
}

function render(){
  let html = '';

  if(state.step === 'capture'){
    html = `
      <div class="step-label"><span class="n">1</span> Prends une photo</div>
      <div class="scan-frame" id="scanFrame" style="position:relative;">
        <div class="corner tl"></div><div class="corner tr"></div>
        <div class="corner bl"></div><div class="corner br"></div>
        <div class="hint">Vise l'objet, ou son étiquette,<br>et touche ici pour prendre la photo</div>
        <input type="file" id="fileInput" accept="image/*"
          style="position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;">
      </div>
      <p class="card-sub" style="margin-top:16px;text-align:center;">On cherche seulement une vraie notice du fabricant. Rien n'est inventé.</p>
    `;
    app.innerHTML = html;
    document.getElementById('fileInput').addEventListener('change', onFileChosen);
    return;
  }

  if(state.step === 'analyzing'){
    html = `
      <div class="step-label"><span class="n">1</span> Prends une photo</div>
      <div class="scan-frame active scanning">
        <img src="${state.imageDataUrl}">
        <div class="scan-line"></div>
        <div class="corner tl"></div><div class="corner tr"></div>
        <div class="corner bl"></div><div class="corner br"></div>
      </div>
      <div class="loader-wrap">
        <div class="spinner"></div>
        <p>ON REGARDE LA PHOTO...</p>
      </div>
    `;
    app.innerHTML = html;
    return;
  }

  if(state.step === 'confirm'){
    html = `
      <div class="step-label"><span class="n">2</span> On a compris ça</div>
      ${state.error ? `<div class="error-box">${state.error}</div>` : ''}
      <div class="id-card">
        <img class="id-thumb" src="${state.imageDataUrl}">
        <div class="eyebrow">Objet reconnu</div>
        <textarea id="descBox" rows="3">${state.description}</textarea>
        <div class="divider"></div>
        <p class="note">Pas le bon objet ? Corrige le texte au-dessus, comme tu veux.</p>
      </div>
      <div class="row">
        <button class="btn btn-primary" id="confirmBtn">C'est bien ça →</button>
      </div>
      <button class="btn btn-secondary" id="retakeBtn" style="margin-top:10px;">Reprendre une photo</button>
      ${dots()}
    `;
    app.innerHTML = html;
    document.getElementById('confirmBtn').addEventListener('click', ()=>{
      state.description = document.getElementById('descBox').value;
      state.step = 'language';
      render();
    });
    document.getElementById('retakeBtn').addEventListener('click', resetToCapture);
    return;
  }

  if(state.step === 'language'){
    html = `
      <div class="step-label"><span class="n">3</span> Choisis la langue</div>
      <div class="lang-list">
        ${LANGS.map(l => `
          <div class="lang-opt ${state.language===l.code?'selected':''}" data-code="${l.code}">
            <span><span class="flag">${l.flag}</span>${l.code}</span>
            <span class="check"></span>
          </div>
        `).join('')}
      </div>
      <div class="row" style="margin-top:20px;">
        <button class="btn btn-primary" id="goSearch" ${state.language? '' : 'disabled'}>Trouver la notice →</button>
      </div>
      ${dots()}
    `;
    app.innerHTML = html;
    document.querySelectorAll('.lang-opt').forEach(el=>{
      el.addEventListener('click', ()=>{
        state.language = el.dataset.code;
        render();
      });
    });
    const goBtn = document.getElementById('goSearch');
    if(state.language){
      goBtn.addEventListener('click', ()=>{
        state.step = 'searching';
        render();
        searchNotice();
      });
    }
    return;
  }

  if(state.step === 'searching'){
    html = `
      <div class="step-label"><span class="n">4</span> La notice</div>
      <div class="loader-wrap">
        <div class="spinner"></div>
        <p>ON CHERCHE LA VRAIE NOTICE,<br>PAS UNE INVENTÉE...</p>
      </div>
    `;
    app.innerHTML = html;
    return;
  }

  if(state.step === 'result'){
    const r = state.result || {};
    const found = r.found;
    html = `
      <div class="step-label"><span class="n">4</span> La notice</div>
      <div class="result-card">
        <div class="stamp-badge ${found? '':'miss'}">${found ? 'TROUVÉE' : 'INTROUVABLE'}</div>
        <h3>${r.product || state.description}</h3>
        ${r.sourceUrl ? `<div class="src">${r.sourceUrl}</div>` : ''}
        <div class="body-text">${r.message || ''}</div>
        ${found && r.sourceUrl ? `<a class="link-btn" href="${r.sourceUrl}" target="_blank">Ouvrir la notice officielle</a>` : ''}
      </div>
      <button class="ghost-link" id="restartBtn">Scanner un autre objet</button>
    `;
    app.innerHTML = html;
    document.getElementById('restartBtn').addEventListener('click', resetAll);
    return;
  }
}

function resetToCapture(){
  state.step='capture';
  state.imageDataUrl=null;
  state.imageBase64=null;
  state.error=null;
  render();
}
function resetAll(){
  state.step='capture';
  state.imageDataUrl=null;
  state.imageBase64=null;
  state.description='';
  state.language=null;
  state.result=null;
  state.error=null;
  render();
}

function onFileChosen(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async function(ev){
    // downscale image for speed/size
    const img = new Image();
    img.onload = async function(){
      const canvas = document.createElement('canvas');
      const maxDim = 1024;
      let w = img.width, h = img.height;
      if(w > h && w > maxDim){ h = h*(maxDim/w); w = maxDim; }
      else if(h > maxDim){ w = w*(maxDim/h); h = maxDim; }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
      state.imageDataUrl = dataUrl;
      state.imageBase64 = dataUrl.split(',')[1];
      state.imageMediaType = 'image/jpeg';
      state.step = 'analyzing';
      render();
      await analyzeImage();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

async function analyzeImage(){
  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 300,
        messages: [{
          role: "user",
          content: [
            { type: "image", source: { type: "base64", media_type: state.imageMediaType, data: state.imageBase64 } },
            { type: "text", text: "Regarde cette photo d'un objet ou de son étiquette. En une ou deux phrases simples et en français, dis quelle est la marque et quel est le produit (modèle si tu le vois écrit). Si tu vois une référence exacte écrite, donne-la. Si tu ne peux que deviner un modèle probable, dis-le clairement (ex: 'probablement un modèle X'). Ne donne que ta description, rien d'autre, pas de préambule." }
          ]
        }]
      })
    });
    const data = await response.json();
    const textBlock = (data.content || []).find(b => b.type === 'text');
    state.description = textBlock ? textBlock.text.trim() : "Objet non identifié — décris-le toi-même ici.";
  }catch(err){
    console.error(err);
    state.description = "On n'a pas réussi à analyser la photo — décris l'objet toi-même ici.";
    state.error = "Petit souci pour analyser la photo. Tu peux écrire toi-même ce que c'est.";
  }
  state.step = 'confirm';
  render();
}

async function searchNotice(){
  try{
    const prompt = `Un utilisateur a cet objet : "${state.description}". Il veut la VRAIE notice officielle du fabricant, en langue : ${state.language}.
Cherche sur le web le lien direct vers le PDF ou la page officielle du fabricant (jamais un site tiers qui a juste copié le contenu, sauf si c'est un distributeur officiel).
Réponds UNIQUEMENT en JSON valide, sans texte autour, avec ce format exact :
{"found": true ou false, "product": "nom simple du produit", "sourceUrl": "url exacte trouvée ou vide", "message": "1 à 2 phrases simples en français qui expliquent ce que tu as trouvé, ou pourquoi ça n'a pas été trouvé"}`;

    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        messages: [{ role: "user", content: prompt }],
        tools: [{ type: "web_search_20250305", name: "web_search" }]
      })
    });
    const data = await response.json();
    const textBlocks = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n');
    let clean = textBlocks.replace(/```json|```/g,'').trim();
    let parsed;
    try{
      const jsonMatch = clean.match(/\{[\s\S]*\}/);
      parsed = JSON.parse(jsonMatch ? jsonMatch[0] : clean);
    }catch(e){
      parsed = { found:false, product: state.description, sourceUrl:'', message: "On n'a pas réussi à lire le résultat de la recherche. Réessaie." };
    }
    state.result = parsed;
  }catch(err){
    console.error(err);
    state.result = { found:false, product: state.description, sourceUrl:'', message:"La recherche n'a pas marché. Vérifie ta connexion et réessaie." };
  }
  state.step = 'result';
  render();
}

render();
</script>
</body>
</html>
